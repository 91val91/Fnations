name: FNations
version: '${version}'
main: fr.fnations.FNations
api-version: '1.21'
description: Nations, R&D, guerres, banque, chambres, armes à feu, véhicules, machines, missiles et fusées.
authors: [FNations]
depend: [WorldEdit]

commands:
  nation:
    description: Système de nations (sans argument = GUI)
    aliases: [n, pays]
  banque:
    description: Banque personnelle et nationale (sans argument = GUI)
    aliases: [bank, argent]
  payer:
    description: Envoyer de l'argent à un joueur
    aliases: [pay]
  recherche:
    description: Recherche & Développement (GUI)
    aliases: [rd, research]
  guerre:
    description: Système de guerres (sans argument = GUI)
    aliases: [war]
  chambre:
    description: Réception des chambres (GUI) / administration
    aliases: [chambres, hotel]
  station:
    description: Ouvre la Station de Craft à distance
    permission: fnations.station.distance
  menu:
    description: Menu principal FNations
  fnations:
    description: Administration FNations
    aliases: [fn]

permissions:
  fnations.admin:
    description: Administration (chambres, give, reload...)
    default: op
    children:
      fnations.admin.bypass: true
      fnations.station.distance: true
  fnations.admin.bypass:
    description: Ignore protections, recherches et restrictions de guerre
    default: op
  fnations.station.distance:
    description: Ouvrir la Station de Craft sans bloc
    default: op
