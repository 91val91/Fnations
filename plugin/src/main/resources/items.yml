# =====================================================================
#  FNations - Items custom
#  material : matériau de base (le visuel vient du resource pack via item_model)
#  model    : modèle du resource pack (défaut fnations:<id>)
#  category : composant, munition, arme, vehicule, machine, missile, fusee, economie
# =====================================================================
items:
  # ---------------- Composants ----------------
  steel_ingot:      {name: "<gray>Lingot d'acier", category: composant}
  steel_plate:      {name: "<gray>Plaque d'acier", category: composant}
  compressed_iron:  {name: "<white>Fer compressé", category: composant}
  carbon_plate:     {name: "<dark_gray>Plaque de carbone", category: composant}
  iron_dust:        {name: "<gray>Poudre de fer", category: composant}
  gold_dust:        {name: "<gold>Poudre d'or", category: composant}
  copper_wire:      {name: "<gold>Fil de cuivre", category: composant}
  circuit:          {name: "<green>Circuit électronique", category: composant}
  advanced_circuit: {name: "<aqua>Circuit avancé", category: composant}
  battery:          {name: "<yellow>Batterie", category: composant}
  solar_cell:       {name: "<blue>Cellule photovoltaïque", category: composant}
  motor:            {name: "<gray>Moteur", category: composant}
  jet_engine:       {name: "<aqua>Réacteur", category: composant, stack: 16}
  rotor:            {name: "<gray>Rotor d'hélicoptère", category: composant, stack: 16}
  tire:             {name: "<dark_gray>Pneu", category: composant}
  track:            {name: "<dark_gray>Chenille", category: composant, stack: 16}
  cockpit:          {name: "<aqua>Cockpit", category: composant, stack: 16}
  gun_barrel:       {name: "<gray>Canon d'arme", category: composant}
  gun_parts:        {name: "<gray>Pièces d'arme", category: composant}
  explosive_charge: {name: "<red>Charge explosive", category: composant}
  warhead:          {name: "<dark_red>Ogive", category: composant, stack: 16}
  guidance_system:  {name: "<aqua>Système de guidage", category: composant, stack: 16}
  nuclear_core:     {name: "<green><b>Cœur nucléaire", category: composant, stack: 4, lore: ["<red>⚠ Radioactif"]}
  heat_shield:      {name: "<gold>Bouclier thermique", category: composant, stack: 16}
  rocket_engine:    {name: "<gold>Moteur-fusée", category: composant, stack: 8}
  fuel_canister:    {name: "<yellow>Jerrican d'essence", category: composant, stack: 16, lore: ["<gray>Clic droit sur un véhicule pour le ravitailler."]}
  rocket_fuel:      {name: "<gold>Ergol de fusée", category: composant, stack: 16, lore: ["<gray>Clic droit sur une fusée pour la remplir."]}

  # ---------------- Munitions ----------------
  ammo_9mm:     {name: "<yellow>Munitions 9mm", category: munition}
  ammo_762:     {name: "<yellow>Munitions 7.62mm", category: munition}
  ammo_sniper:  {name: "<yellow>Munitions .50 BMG", category: munition}
  ammo_shotgun: {name: "<yellow>Cartouches calibre 12", category: munition}
  rpg_rocket:   {name: "<red>Roquette RPG", category: munition, stack: 8}
  tank_shell:   {name: "<red>Obus de char", category: munition, stack: 16}

  # ---------------- Armes à feu ----------------
  pistol:        {name: "<white>Pistolet M9", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer", "<gray>F : recharger", "<gray>Accroupi : viser"]}
  smg:           {name: "<white>Pistolet-mitrailleur", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer", "<gray>F : recharger"]}
  assault_rifle: {name: "<white>Fusil d'assaut", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer", "<gray>F : recharger", "<gray>Accroupi : viser"]}
  shotgun:       {name: "<white>Fusil à pompe", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer", "<gray>F : recharger"]}
  sniper:        {name: "<white>Fusil de précision", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer", "<gray>F : recharger", "<gray>Accroupi : lunette"]}
  rpg:           {name: "<red>Lance-roquettes RPG", category: arme, stack: 1, lore: ["<gray>Clic droit : tirer une roquette", "<gray>F : recharger"]}

  # ---------------- Véhicules ----------------
  tank:       {name: "<dark_green><b>Char d'assaut", category: vehicule, stack: 1, lore: ["<gray>Clic droit au sol pour déployer."]}
  plane:      {name: "<aqua><b>Avion de chasse", category: vehicule, stack: 1, lore: ["<gray>Clic droit au sol pour déployer."]}
  helicopter: {name: "<green><b>Hélicoptère", category: vehicule, stack: 1, lore: ["<gray>Clic droit au sol pour déployer."]}
  tractor:    {name: "<red><b>Tracteur", category: vehicule, stack: 1, lore: ["<gray>Clic droit au sol pour déployer.", "<gray>Récolte et replante les cultures."]}

  # ---------------- Spatial ----------------
  rocket: {name: "<gold><b>Fusée spatiale", category: fusee, stack: 1, lore: ["<gray>Clic droit au sol pour l'installer.", "<gray>Remplir avec de l'Ergol de fusée."]}

  # ---------------- Machines (blocs posables) ----------------
  crafting_station: {name: "<gold><b>Station de Craft", material: SMITHING_TABLE, category: machine, lore: ["<gray>Fabrique armes, véhicules, machines,", "<gray>missiles et fusées."]}
  compressor:       {name: "<white>Compresseur", material: IRON_BLOCK, category: machine, lore: ["<gray>Consomme : 20 E/s"]}
  coal_generator:   {name: "<dark_gray>Générateur à charbon", material: POLISHED_BLACKSTONE, category: machine, lore: ["<gray>Produit : 60 E/s"]}
  solar_panel_t1:   {name: "<blue>Panneau solaire <white>Tier 1", material: LIGHT_BLUE_TERRACOTTA, category: machine, lore: ["<gray>Produit : 10 E/s (jour)"]}
  solar_panel_t2:   {name: "<blue>Panneau solaire <yellow>Tier 2", material: BLUE_TERRACOTTA, category: machine, lore: ["<gray>Produit : 30 E/s (jour)"]}
  solar_panel_t3:   {name: "<blue>Panneau solaire <light_purple>Tier 3", material: PURPLE_TERRACOTTA, category: machine, lore: ["<gray>Produit : 80 E/s (jour)", "<gray>25% de la production la nuit"]}
  electric_furnace: {name: "<red>Four électrique", material: SMOOTH_STONE, category: machine, lore: ["<gray>Consomme : 15 E/s"]}
  crusher:          {name: "<gray>Concasseur", material: POLISHED_ANDESITE, category: machine, lore: ["<gray>Consomme : 30 E/s", "<gray>Recycle les missiles en composants."]}
  switch:           {name: "<red>Interrupteur de sécurité", material: RED_TERRACOTTA, category: machine, lore: ["<gray>Coupe les machines du réseau", "<gray>(rayon 16 blocs) en cas de surchauffe."]}
  missile_launcher: {name: "<dark_red><b>Lanceur de missiles", material: NETHERITE_BLOCK, category: machine, lore: ["<gray>Consomme de l'énergie au tir."]}

  # ---------------- Missiles ----------------
  missile_tactical:  {name: "<red>Missile tactique", category: missile, stack: 4, lore: ["<gray>Portée : 400 blocs"]}
  missile_cruise:    {name: "<red>Missile de croisière", category: missile, stack: 4, lore: ["<gray>Portée : 2 000 blocs"]}
  missile_ballistic: {name: "<dark_red>Missile balistique", category: missile, stack: 2, lore: ["<gray>Portée : 6 000 blocs"]}
  missile_nuclear:   {name: "<dark_green><b>Missile nucléaire", category: missile, stack: 1, lore: ["<gray>Portée : 12 000 blocs", "<red>⚠ Zone irradiée après impact"]}

  # ---------------- Économie ----------------
  banknote: {name: "<green>Billet de banque", category: economie, lore: ["<gray>Clic droit pour déposer en banque."]}
