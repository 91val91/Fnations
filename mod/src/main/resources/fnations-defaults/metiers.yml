# =====================================================================
#              FNations - Métiers (compétences des joueurs)
# =====================================================================
# Chaque source s'écrit [xp, argent]. Les clés de blocs acceptent un
# identifiant (minecraft:coal_ore) ou un tag (#minecraft:logs).

# XP totale à atteindre pour chaque palier (6 paliers)
paliers: [500, 2000, 5000, 12000, 25000, 50000]
# Argent versé une seule fois en atteignant chaque palier
recompenses: [250, 750, 2000, 5000, 12000, 30000]
multiplicateur-xp: 1.0
multiplicateur-argent: 1.0
compter-en-creatif: false

mineur:
  blocs:
    "#minecraft:base_stone_overworld": [0.4, 0.01]
    "#minecraft:base_stone_nether": [0.3, 0.01]
    "minecraft:end_stone": [0.5, 0.02]
    "minecraft:coal_ore": [3, 0.4]
    "minecraft:deepslate_coal_ore": [3.5, 0.45]
    "minecraft:copper_ore": [3, 0.4]
    "minecraft:deepslate_copper_ore": [3.5, 0.45]
    "minecraft:iron_ore": [6, 0.8]
    "minecraft:deepslate_iron_ore": [7, 0.9]
    "minecraft:gold_ore": [8, 1.2]
    "minecraft:deepslate_gold_ore": [9, 1.3]
    "minecraft:nether_gold_ore": [5, 0.6]
    "minecraft:redstone_ore": [5, 0.6]
    "minecraft:deepslate_redstone_ore": [6, 0.7]
    "minecraft:lapis_ore": [6, 0.8]
    "minecraft:deepslate_lapis_ore": [7, 0.9]
    "minecraft:nether_quartz_ore": [4, 0.5]
    "minecraft:diamond_ore": [20, 4]
    "minecraft:deepslate_diamond_ore": [22, 4.5]
    "minecraft:emerald_ore": [25, 5]
    "minecraft:deepslate_emerald_ore": [27, 5.5]
    "minecraft:ancient_debris": [40, 10]
    "minecraft:amethyst_cluster": [3, 0.3]

bucheron:
