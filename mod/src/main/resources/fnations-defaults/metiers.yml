    "minecraft:bamboo": [0.3, 0.02]
    "minecraft:torchflower": [3, 0.3]
    "minecraft:pitcher_plant": [3, 0.3]

chasseur:
  monstres: [5, 0.8]          # tout monstre non listé
  animaux: [1.5, 0.15]        # tout animal non listé
  entites:
    "minecraft:creeper": [6, 1]
    "minecraft:enderman": [12, 2.5]
    "minecraft:blaze": [10, 2]
    "minecraft:witch": [10, 2]
    "minecraft:wither_skeleton": [15, 3.5]
