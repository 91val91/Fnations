    "#minecraft:impermeable": [1.5, 0.05]
    "minecraft:lantern": [2, 0.08]
    "minecraft:sea_lantern": [2, 0.08]

ingenieur:
  poser-machine: [5, 1]
  station:                    # par fabrication, selon la catégorie de l'objet
    COMPOSANT: [4, 1]
    MUNITION: [2, 0.5]
    ARME: [20, 5]
    VEHICULE: [60, 15]
    MACHINE: [30, 8]
    MISSILE: [50, 12]
