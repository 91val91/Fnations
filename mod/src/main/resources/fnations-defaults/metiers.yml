    "minecraft:carrots": [2, 0.15]
    "minecraft:potatoes": [2, 0.15]
    "minecraft:beetroots": [2, 0.15]
    "minecraft:nether_wart": [2.5, 0.2]
    "minecraft:cocoa": [2.5, 0.2]
    "minecraft:melon": [2, 0.15]
    "minecraft:pumpkin": [2, 0.15]
