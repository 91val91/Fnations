# FNations - server.properties (extrait des réglages importants)
motd=§6FNations §7- Nations, guerres & conquête spatiale
level-name=world
gamemode=survival
difficulty=normal
pvp=true
# Les avions / hélicoptères nécessitent allow-flight
allow-flight=true
spawn-protection=0
view-distance=10
simulation-distance=8
max-players=50
online-mode=true
# Resource pack (modèles des armes, véhicules, machines...) :
# hébergez FNations-RP.zip (voir tools/build.sh) puis renseignez l'URL et le SHA-1
resource-pack=
resource-pack-sha1=
require-resource-pack=true
resource-pack-prompt={"text":"Le pack FNations est requis (armes, véhicules, machines).","color":"gold"}
